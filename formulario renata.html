
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de Cadastro</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: white;
            width: 100%;
            max-width: 550px;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
            color: #333;
        }

        .campo {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #444;
        }

        input, select, textarea {
            width: 100%;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
            outline: none;
        }

        input:focus, select:focus, textarea:focus {
            border-color: #007bff;
            box-shadow: 0 0 5px rgba(0,123,255,0.3);
        }

        .opcoes {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .opcoes label {
            font-weight: normal;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .opcoes input {
            width: auto;
        }

        textarea {
            resize: vertical;
            min-height: 90px;
        }

        .botoes {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 6px;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        .enviar {
            background-color: #007bff;
        }

        .enviar:hover {
            background-color: #0056b3;
        }

        .limpar {
            background-color: #6c757d;
        }

        .limpar:hover {
            background-color: #495057;
        }

        @media (max-width: 480px) {
            .container {
                padding: 20px;
            }

            .botoes {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Formulário de Cadastro</h1>

        <form>
            <div class="campo">
                <label for="nome">Nome completo:</label>
                <input type="text" id="nome" name="nome"
                placeholder="Digite seu nome" required>
            </div>

            <div class="campo">
                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email"
                placeholder="exemplo@gmail.com" required>
            </div>

            <div class="campo">
                <label for="senha">Senha:</label>
                <input type="password" id="senha" name="senha"
                placeholder="Digite sua senha" required>
            </div>

            <div class="campo">
                <label for="nascimento">Data de nascimento:</label>
                <input type="date" id="nascimento" name="nascimento" required>
            </div>

            <div class="campo">
                <label for="curso">Curso:</label>
                <select id="curso" name="curso" required>
                    <option value="">Selecione seu curso</option>
                    <option value="programacao">Programação</option>
                    <option value="informatica">Informática</option>
                    <option value="administracao">Administração</option>
                    <option value="design">Design</option>
                </select>
            </div>

            <div class="campo">
                <label>Sexo:</label>
                <div class="opcoes">
                    <label><input type="radio" name="sexo" value="masculino"> Masculino</label>
                    <label><input type="radio" name="sexo" value="feminino"> Feminino</label>
                    <label><input type="radio" name="sexo" value="outro"> Outro</label>
                </div>
            </div>

            <div class="campo">
                <label>Interesses:</label>
                <div class="opcoes">
                    <label><input type="checkbox" name="interesses" value="tecnologia"> Tecnologia</label>
                    <label><input type="checkbox" name="interesses" value="games"> Games</label>
                    <label><input type="checkbox" name="interesses" value="esportes"> Esportes</label>
                </div>
            </div>

            <div class="campo">
                <label for="foto">Enviar foto:</label>
                <input type="file" id="foto" name="foto" accept="image/*">
            </div>

            <div class="campo">
                <label for="comentarios">Comentários:</label>
                <textarea id="comentarios" name="comentarios"
                placeholder="Digite seus comentários..."></textarea>
            </div>

            <div class="botoes">
                <button type="submit" class="enviar">Enviar</button>
                <button type="reset" class="limpar">Limpar</button>
            </div>
        </form>
    </div>

</body>
</html>
